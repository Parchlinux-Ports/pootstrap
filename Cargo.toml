[package]
name = "pootstrap"
version = "0.1.0"
edition = "2024"
description = "Clean-room bootstrap and image builder for Parch Linux Mobile"
license = "AGPL-3.0-or-later"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
indicatif = "0.17"
nix = { version = "0.29", features = ["mount", "sched", "signal", "user"] }
which = "7.0"
tempfile = "3.17"
walkdir = "2.5"
dialoguer = "0.11"
